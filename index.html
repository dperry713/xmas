<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#080D1A" />
    <title>The Advent Piazza — A 24-Day Interactive Journey</title>
    <meta name="description" content="A 24-day interactive Advent Calendar set in an illustrated European piazza that progressively awakens across December with daily reflections, activities, and music." />
    
    <!-- Open Graph & Social Cards -->
    <meta property="og:title" content="The Advent Piazza — 24-Day Interactive Advent Calendar" />
    <meta property="og:description" content="Discover 24 moments of warmth, reflection, and community as a European piazza awakens across December." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/assets/piazza_master.jpg" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Outfit:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <!-- Main Header Landmark -->
      <header class="app-header" role="banner">
        <div class="header-brand">
          <h1 class="app-title" id="appTitle">
            <span class="title-icon" aria-hidden="true">✦</span>
            The Advent Piazza
          </h1>
          <p class="app-subtitle" id="appSubtitle">A 24-Day Journey of Light, Community & Expectation</p>
        </div>

        <div class="header-controls">
          <!-- Awakening Progress Pill -->
          <div class="header-progress-pill" id="headerProgressPill" title="Moments completed">
            <span class="progress-star-icon" aria-hidden="true">⭐</span>
            <span class="progress-text" id="progressCountText">0 of 24</span>
          </div>

          <!-- Audio Toggle -->
          <button 
            type="button" 
            class="header-btn header-btn-icon" 
            id="btnHeaderAudio" 
            title="Toggle Soundscape" 
            aria-label="Toggle ambient chimes"
          >
            <svg id="iconAudioOn" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
            <svg id="iconAudioOff" style="display: none;" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
          </button>

          <!-- Calendar Drawer Toggle -->
          <button 
            type="button" 
            class="header-btn" 
            id="btnOpenCalendar" 
            title="View All 24 Days" 
            aria-label="Open Advent Calendar overview"
          >
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            <span id="btnCalendarText">Calendar</span>
          </button>
        </div>
      </header>

      <!-- Main Interactive Piazza Canvas Landmark -->
      <main class="app-main" id="piazzaContainer" role="main"></main>
    </div>

    <!-- Application Script -->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
